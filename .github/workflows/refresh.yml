name: Refresh BYD store data

on:
  schedule:
    # 每 30 分钟一次，避开整点/半点（GitHub 在 :00 和 :30 负载最高，常延迟或跳过）
    - cron: "7,37 * * * *"
  workflow_dispatch:        # 也可在 Actions 页面手动触发

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape bydautomotive.com.au/find-us
        run: python3 scrape_byd.py --out docs/data

      - name: Commit updated data (only if changed)
        run: |
          git config user.name  "store-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data/locations.json docs/data/history.json
          if git diff --cached --quiet; then
            echo "No data change"
          else
            git commit -m "data: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
